services:
  - type: web
    name: thuvtm-hcmc-attendance
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/students.db
    disk:
      name: thuvtm-student-data
      mountPath: /var/data
      sizeGB: 1

